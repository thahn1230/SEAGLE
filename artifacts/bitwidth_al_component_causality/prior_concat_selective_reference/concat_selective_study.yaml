# Concat-selective rotation study (docs/CONCAT_SELECTIVE_EXPERIMENT_PROTOCOL.md)
gpus: {cuda_device_order: PCI_BUS_ID, cuda_visible_devices: "6,7", assert_count: 2}
models: {target: meta-llama/Llama-2-7b-chat-hf, draft: yuhuili/EAGLE-llama2-chat-7B}
rotation: {type: random_hadamard (random_rotation_control), seed: 0}
architecture:
  embedding: original basis (bit-exact checkpoint copy, fp16)
  projection_first_preR: "[W_e | W_h·D_gamma·R1] + bias b"
  projection_recurrent_preR: "[W_e | W_h·R1] + bias b"
  post_projection_R1: explicit dense fp32 GEMM after the 2D->D projection
  ar_decoder: R1-conjugated; head W_lm·R1
decoding: {mode: greedy, tree: mc_sim_7b_63, chat_template: llama2}
gate_a: {num_prompts: 8, max_new_tokens: 48}
matrix: {num_prompts: 20, max_new_tokens: 64}
stats: {bootstrap: 10000, ci: 0.95, epsilon: "max(0.05, 1% baseline)"}
real_kernel: {w4a4: QuaRot CUTLASS INT4xINT4, kv: fp16, w4a16: tinygemm g128}
