# DFlash × SEAGLE transfer — Llama-3.1-8B-Instruct rotation-optimization config
# Used ONLY by eagle_spinquant scripts/10_optimize_rotation.py (reads model.target).
# Lives in dflash_workspace so the SEAGLE repo stays untouched.

experiment:
  name: dflash_seagle_llama31_8b_instruct
  seed: 42
  output_dir: /home/thahn1230/dflash_workspace/outputs

model:
  target: meta-llama/Llama-3.1-8B-Instruct
  eagle_draft: yuhuili/EAGLE-llama2-chat-7B   # unused by rotation optimization
  architecture: LlamaForCausalLM
  dtype: bfloat16

paths:
  eagle_repo: third_party/EAGLE
  spinquant_repo: third_party/SpinQuant
  rotation_checkpoint: /home/thahn1230/dflash_workspace/outputs/rotations/llama31_w16a4kv16/R.bin

rotation:
  optimize_w_bits: 16
  optimize_a_bits: 4
  optimize_kv_bits: 16
  learning_rate: 1.5
  max_steps: 100
  seqlen: 2048
  per_device_batch_size: 1
  nproc_per_node: 4
  gradient_checkpointing: true

quantization:
  w_bits: 4
  a_bits: 4
  k_bits: 16
  v_bits: 16
  w_method: rtn
  w_clip: true
  a_asym: true
  k_asym: true
  v_asym: true
  k_groupsize: 128
  v_groupsize: 128
  gptq_calib_samples: 128

evaluation:
  ppl_dataset: wikitext2
  ppl_seqlen: 2048
  temperature: 0.0
  max_new_tokens: 512

hardware:
  gpus_available: 8
  default_visible_devices: "1"
