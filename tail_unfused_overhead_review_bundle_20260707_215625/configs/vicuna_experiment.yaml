# Vicuna-7B-v1.3 + official EAGLE-1 draft — second model pair for the
# rotation-interface generality study (see docs/vicuna_rotation_study_notes.md).
# Weights are staged on /data (root disk was at 100%); rotations for this
# target live under /data too, NEVER shared with the Llama-2 R.bin files.

experiment:
  name: rotated_eagle1_vicuna_7b_v13
  seed: 42
  output_dir: outputs

model:
  target: lmsys/vicuna-7b-v1.3
  eagle_draft: yuhuili/EAGLE-Vicuna-7B-v1.3
  architecture: LlamaForCausalLM
  dtype: float16
  chat_template: vicuna        # fastchat vicuna_v1.1, as in EAGLE's vicuna eval

paths:
  eagle_repo: third_party/EAGLE
  spinquant_repo: third_party/SpinQuant
  # resolved from /data HF cache 2026-07-04 (downloaded this session)
  target_weights_local: /data/thahn1230/hf_cache/models--lmsys--vicuna-7b-v1.3/snapshots/236eeeab96f0dc2e463f2bebb7bb49809279c6d6
  draft_weights_local: /data/thahn1230/hf_cache/models--yuhuili--EAGLE-Vicuna-7B-v1.3/snapshots/11ed6a1022f89a8047b90af8853f189a31c99caa
  rotations_root: /data/thahn1230/eagle_spinquant_outputs/rotations_vicuna

rotation:
  # No learned rotation trained for Vicuna (out of scope unless everything
  # else completes; random-Hadamard R1/R2 only). See study notes doc.
  optimize_w_bits: 16
  optimize_a_bits: 4
  optimize_kv_bits: 4

quantization:
  w_bits: 4
  a_bits: 4
  k_bits: 4
  v_bits: 4
  w_method: rtn                # fake-quant RTN, same as the Llama-2 study
  w_clip: true
  a_asym: true
  k_asym: true
  v_asym: true
  k_groupsize: 128
  v_groupsize: 128
