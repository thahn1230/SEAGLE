candidates:
- candidate_name: llama2-7b-chat
  hf_target_model: meta-llama/Llama-2-7b-chat-hf
  hf_eagle_draft_or_training_source: yuhuili/EAGLE-llama2-chat-7B
  architecture: LlamaForCausalLM
  eagle_support_status: official-weights
  spinquant_support_status: official-script
  recommended_initial_candidate: true
  reason: 'Only 7B candidate that is first-class on BOTH sides: official EAGLE-1 draft weights + dedicated
    llama2chat eval scripts on the v1 branch, and SpinQuant''s headline Llama-2 family with published
    W4A4KV4 results. Fits one RTX 4090 (~13.5GB target fp16 + ~0.5GB draft). Caveats: HF repo is GATED
    (accept Meta license + HF token; SpinQuant --access_token / huggingface-cli login); SpinQuant''s published
    pre-optimized rotations cover only the BASE Llama-2-7B, so R1/R2 must be optimized locally for the
    chat model (100 steps).

    '
  checks:
    architecture_rotatable: true
    target_weights_cached: true
    draft_is_repo: true
    draft_weights_cached: true
    target_config: ok
    draft_config: ok
    target_hidden_size: 4096
    target_vocab_size: 32000
    target_num_heads: 32
    target_rope_theta: 10000.0
    target_tie_word_embeddings: false
    hidden_size_match: true
    vocab_size_match: true
